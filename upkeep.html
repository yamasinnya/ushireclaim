<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>やまやま牧場 - 1日の始まり</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
.upkeep-text { color:#d8e8c0; font-size:15px; line-height:1.8; margin:8px 0 4px; }
.upkeep-quality-note { color:#f0c060; font-size:15px; line-height:1.8; margin:4px 0 0; white-space:pre-line; }
.upkeep-calf-sale-note { color:#e8a860; font-size:15px; line-height:1.8; margin:4px 0 0; white-space:pre-line; }
</style>
</head>
<body>

<div id="gameHeader" class="game-header"></div>
<div class="screen-wrap">
  <div class="screen-title" id="title"></div>
  <div class="upkeep-text" id="upkeep-text"></div>
  <div class="upkeep-quality-note" id="upkeep-quality-note"></div>
  <div class="upkeep-calf-sale-note" id="upkeep-calf-sale-note"></div>
  <button class="btn-main" id="btn-next"></button>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  await loadDict();

  const state = loadLoopState();

  const params = new URLSearchParams(location.search);

  // 1日の始まりには複数のイベント（チュートリアル・妊娠鑑定・出荷・昇格・流産）が同じ日に重なりうる。
  // 各イベントは専用ページへ遷移して戻ってくるが、その際に既存のskipフラグを引き継がないと
  // 「先に表示し終えたイベントがもう一度発火する」「別イベントのフラグに巻き込まれて表示されないまま終わる」
  // という不具合が起きるため、戻り先URLは現在のクエリを保持したままフラグを1つ足す形で組み立てる
  function upkeepReturnUrl(flag) {
    const next = new URLSearchParams(params);
    next.set(flag, '1');
    return encodeURIComponent('upkeep.html?' + next.toString());
  }

  // 序盤チュートリアルはtruck_talk.htmlに移譲（指示書_軽トラ会話汎用ページ(truck_talk.html)の実装.md、指示書_3日目チュートリアル（街の説明）.md対応）
  const skipTutorial = params.get('skip_tutorial') === '1';
  const TUTORIAL_SCENE_FOR_DAY = { 2: 'day2_tutorial', 3: 'day3_tutorial', 4: 'day4_tutorial', 5: 'day5_tutorial', 7: 'illness_tutorial', 10: 'day10_tutorial', 14: 'calf_tutorial', 16: 'breeding_tutorial', 20: 'daichi_tutorial', 22: 'grass_shortage_tutorial', 30: 'calf_sale_tutorial', 31: 'adult_tutorial' };
  const tutorialScene = TUTORIAL_SCENE_FOR_DAY[state.day];
  if (tutorialScene && !skipTutorial) {
    location.href = `truck_talk.html?scene=${tutorialScene}&next=${upkeepReturnUrl('skip_tutorial')}`;
    return;
  }

  // 妊娠確定／着床失敗の通知：種付けから2日後（＝着床判定の翌日）の「1日の始まり」で発火する
  // プレイヤーはこのイベントで初めて結果を知る（着床失敗でも同様。指示書_発情・種付け・妊娠システム実装.md対応）
  // 判定を「>=」にしているのは、何らかの理由でその日に表示できなかった場合でも翌日以降に必ず解消させるため。
  // 未鑑定のまま放置されるとbreedingStateが'inseminated'で固まり、発情判定が二度と走らなくなる
  const skipReveal = params.get('skip_reveal') === '1';
  const revealingCow = state.cows.find(cow => cow.breedingState === 'inseminated' && cow.inseminatedDay > 0 && state.day >= cow.inseminatedDay + 2);
  if (revealingCow && !skipReveal) {
    const success = revealingCow.pregnantDay > 0;
    revealingCow.breedingState = success ? 'pregnant' : 'failed';
    saveLoopState(state);
    location.href = `truck_talk.html?scene=${success ? 'pregnancy_confirmed' : 'pregnancy_failed'}&next=${upkeepReturnUrl('skip_reveal')}`;
    return;
  }

  // 売買（ドナドナ演出）：申込み翌日の「1日の始まり」で専用ページへ遷移する
  // 子牛（指示書_子牛売買申込み.md対応）と成牛（指示書_成牛の売却申込み.md対応）で同じ演出を共用する。
  // 判定を「>=」にしているのは、date_change後・upkeep到達前にブラウザを閉じるとその日のupkeepが
  // 実行されず、「===」だと申込み済みのまま永久に出荷されない状態になりうるため
  const skipCalfSale = params.get('skip_calf_sale') === '1';
  const departingCalves = state.cows.filter(cow => cow.saleApplied && state.day >= (cow.saleAppliedDay || 0) + 1);
  if (departingCalves.length > 0 && !skipCalfSale) {
    const calfIds = departingCalves.map(cow => cow.id).join(',');
    location.href = `calf_sale.html?calfIds=${encodeURIComponent(calfIds)}&next=${upkeepReturnUrl('skip_calf_sale')}`;
    return;
  }

  // 成牛昇格イベント：生後21日を迎えた未申込みの子牛を専用ページで昇格させる
  // （指示書_子牛の成牛昇格イベント実装.md対応。申込み済みは上記のドナドナで出荷済みなので対象外）
  const skipPromotion = params.get('skip_promotion') === '1';
  const promotingCalves = state.cows.filter(cow => cow.type === 'calf' && !cow.saleApplied && (cow.age || 0) >= 21);
  if (promotingCalves.length > 0 && !skipPromotion) {
    const calfIds = promotingCalves.map(cow => cow.id).join(',');
    location.href = `adult_promotion.html?calfIds=${encodeURIComponent(calfIds)}&next=${upkeepReturnUrl('skip_promotion')}`;
    return;
  }

  // 良いランダムイベント：ホーム画面の人形芝居演出を専用ページで見せる
  // （指示書_良いランダムイベント（人形芝居演出）実装.md対応）
  // ここでは発生の有無だけ判定し、種類の抽選と効果の適用はgood_event.html側で行う
  const skipGoodEvent = params.get('skip_good_event') === '1';
  const goodEventFires = state.cows.length > 0
    && (GOOD_EVENT_FORCE_BY_DAY[state.day] !== undefined || Math.random() < GOOD_EVENT_RATE);
  if (goodEventFires && !skipGoodEvent) {
    location.href = `good_event.html?next=${upkeepReturnUrl('skip_good_event')}`;
    return;
  }

  // 出産予定日の確定：pregnantDayが15に達した時点でactualBirthDayをランダム確定（指示書_出産システムの実装.md対応）
  state.cows.forEach(cow => {
    if (cow.pregnantDay === 15 && !cow.actualBirthDay) {
      cow.actualBirthDay = 16 + Math.floor(Math.random() * 5); // 16〜20のランダム
    }
  });

  // 流産判定：立ち会い流産（出産日を過ぎても牛舎に行かなかった）／品質劣による流産リスク（毎日10%）
  // 1頭でも流産したらtruck_talk.htmlで告知して即遷移するため、複数頭が同時該当しても先頭の1頭のみ処理する
  function triggerMiscarriage(cow, reason) {
    cow.pregnantDay = 0;
    cow.actualBirthDay = 0;
    cow.breedingState = 'none'; // 通常の発情待ちループに戻す（指示書_発情・種付け・妊娠システム実装.md対応）
    saveLoopState(state);
    // pregnantDayを0にした時点で再発火しなくなるが、他イベントのフラグを消さないよう専用フラグで戻る
    location.href = `truck_talk.html?scene=miscarriage&next=${upkeepReturnUrl('skip_miscarriage')}`;
  }
  for (const cow of state.cows) {
    if (cow.pregnantDay > 0 && cow.actualBirthDay > 0 && cow.pregnantDay > cow.actualBirthDay) {
      triggerMiscarriage(cow, 'missed');
      return;
    }
    if (cow.pregnantDay > 0 && getQualityTier(cow.qualityPoint) === 1 && Math.random() < 0.10) {
      triggerMiscarriage(cow, 'quality');
      return;
    }
  }

  // 病気の放置ペナルティ：発症中は毎日 体調-1（下限1）。品質へはこの体調低下を通じて間接的に効くので、
  // 病気専用のqualityPoint減少処理は作らない（指示書_病気システム本体の実装.md対応）
  // 下記の発症判定より先に行うことで、その日に発症したばかりの牛はまだ減点されない（気づく猶予を1日設ける）
  state.cows.forEach(cow => {
    if (!cow.diseaseAlert) return;
    cow.condition = Math.max(1, cow.condition - ILLNESS_CONDITION_PENALTY);
  });

  // 病気の発症判定（指示書_病気システム本体の実装.md対応）
  // 7日目以降のみ（day7チュートリアルで説明する前に発症させないため）。
  // 対象はスキルを持つ母牛のみで、発症中の牛は二重発症させない。事前通知は行わず牛舎の「!」で気づかせる
  if (state.day >= ILLNESS_START_DAY) {
    state.cows.forEach(cow => {
      if (cow.type !== 'mother') return;
      if (!cow.skill) return;
      if (cow.diseaseAlert) return;
      if (Math.random() < ILLNESS_ONSET_RATE) {
        cow.diseaseAlert = true;
        // 日誌：発症の記録
        addJournalEntry({
          day: state.day, category: 'sick',
          cowId: cow.id, cowName: cow.name,
          text: `${cow.name}の様子がおかしい。獣医に診てもらったほうがよさそうだ。`,
        });
      }
    });
  }

  // 床替え：3日に1回、母牛の💩を+1（上限4）。4個で品質ポイントも-1（指示書_牛舎実装フェーズ2_床替え.md対応、頻度は口頭で3日に1回と修正）
  if (state.day % 3 === 0) {
    state.cows.forEach(cow => {
      if (cow.type === 'mother') {
        cow.poopCount = Math.min(4, (cow.poopCount || 0) + 1);
      }
    });
  }
  // 💩ペナルティは母牛のみ対象（子牛は床替えシステム対象外。指示書_子牛の成長ステージと特殊ルール実装.md対応）
  state.cows.forEach(cow => {
    if (cow.type !== 'mother') return;
    if (cow.poopCount >= 4) {
      cow.qualityPoint = Math.max(0, (cow.qualityPoint || 0) - 5);
    }
  });

  // 体調ベースの品質ポイント日次加算（指示書_母牛の品質ポイント（体調ベースの日々加算）実装.md対応）
  // レア加算・💩減少とは独立処理。体調6を基準に差分をそのまま加減算し、下限0でクランプする
  state.cows.forEach(cow => {
    if (cow.type !== 'mother') return;
    cow.qualityPoint = Math.max(0, (cow.qualityPoint || 0) + getConditionQualityDelta(cow.condition));
  });

  // 品質ティアの変化通知：前日チェック時からティアが変わっていたら知らせる（上がっても下がっても。口頭指示対応）
  // ここまでで探索・給餌・💩・体調ベースの加減算が全て反映済みなので、この時点のティアを「今日のティア」とする
  const tierUpNames = [];
  const tierDownNames = [];
  state.cows.forEach(cow => {
    const newTier = getQualityTier(cow.qualityPoint);
    const prevTier = (typeof cow.lastKnownQualityTier === 'number') ? cow.lastKnownQualityTier : newTier;
    if (newTier > prevTier) tierUpNames.push(cow.name);
    else if (newTier < prevTier) tierDownNames.push(cow.name);
    cow.lastKnownQualityTier = newTier;
  });
  let qualityTierNote = '';
  if (tierUpNames.length) qualityTierNote += tierUpNames.join('、') + t('quality_tier_up');
  if (tierDownNames.length) qualityTierNote += (qualityTierNote ? '\n' : '') + tierDownNames.join('、') + t('quality_tier_down');

  // 妊娠経過日数を+1（指示書_プロローグ更新版.md追記対応。出産予定日確定・流産判定は上記の出産システム実装対応）
  state.cows.forEach(cow => {
    if (cow.pregnantDay > 0) {
      cow.pregnantDay += 1;
    }
  });

  // 着床判定：種付け実行の翌日に一律80%（指示書_発情・種付け・妊娠システム実装.md対応）
  // 結果はここでは通知しない。プレイヤーへの明示は2日後の妊娠確定/着床失敗イベントで行う（上記のrevealingCow参照）
  state.cows.forEach(cow => {
    if (cow.breedingState === 'inseminated' && cow.inseminatedDay > 0 && state.day === cow.inseminatedDay + 1) {
      if (Math.random() < 0.80) {
        cow.pregnantDay = 1;
      }
      // 失敗時はpregnantDayを0のまま据え置き、breedingStateは'inseminated'を維持する（reveal日まで表示を変えないため）
    }
  });

  // 発情判定：非妊娠・未授精の母牛を対象に、品質ティア別の確率で毎日判定（指示書_発情・種付け・妊娠システム実装.md対応）
  // 発情を逃した（前日発情のまま種付けしなかった）場合は機会が消え、この判定で新しくやり直す。
  // 着床失敗表示('failed')は次の発情が来る（この判定で成功する）まで維持する
  state.cows.forEach(cow => {
    if (cow.type !== 'mother') return;
    if (cow.pregnantDay > 0) return;
    if (cow.breedingState === 'inseminated') return;
    const prob = ESTRUS_PROBABILITY[getQualityTier(cow.qualityPoint)] || 0;
    if (Math.random() < prob) {
      cow.breedingState = 'estrus';
    } else if (cow.breedingState !== 'failed') {
      cow.breedingState = 'none';
    }
  });

  // 子牛の日齢を+1（指示書_子牛の牛舎表示実装.md対応）
  state.cows.forEach(cow => {
    if (cow.type === 'calf') {
      cow.age = (cow.age || 0) + 1;
    }
  });

  // 子牛売買申込みの対象通知：生後17〜20日の未申込み子牛が1頭でもいれば2行の通知を出す（頭数分は出さない）
  const saleEligibleCalves = state.cows.filter(cow => cow.type === 'calf' && !cow.saleApplied && cow.age >= 17 && cow.age <= 20);
  let calfSaleNote = '';
  if (saleEligibleCalves.length > 0) {
    calfSaleNote = t('calf_sale_notice_00') + '\n' + t('calf_sale_notice_01');
  }

  saveLoopState(state);
  renderHeader('gameHeader');

  const titleEl = document.getElementById('title');
  const textEl = document.getElementById('upkeep-text');
  const btn = document.getElementById('btn-next');

  // アップキープの通常表示（「発情している」「難産の様子」は本物の発情・妊娠システムと意味が
  // 重複するため削除。口頭指示対応）
  function showUpkeepMain() {
    titleEl.textContent = t('upkeep_title');
    textEl.textContent = t('upkeep_none');
    document.getElementById('upkeep-quality-note').textContent = qualityTierNote;
    document.getElementById('upkeep-calf-sale-note').textContent = calfSaleNote;
    btn.textContent = t('btn_go_home');
    btn.onclick = () => { location.href = 'home.html'; };
  }

  showUpkeepMain();
})();
</script>

</body>
</html>
