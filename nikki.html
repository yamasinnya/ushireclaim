<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>やまやま牧場 - 牧場日誌</title>
<style>
/* デザインはやましさん作のデモ(nikki_demo.html)を踏襲。
   Webフォントは外部読み込みになるため使わず、端末のフォントで組む */
:root {
  --bg: #d9c9a3;
  --wood: #6b4a2f;
  --wood-dark: #43301e;
  --paper: #f4ecd6;
  --line: #dccca3;
  --ink: #3b2b1d;
  --ink-soft: #8a7659;
  --mana: #3f8f5f;
  --mana-soft: #cfe9d8;
  --gold: #b8892f;
  --stamp-ship: #a8482f;
  --stamp-sick: #7d7361;
  --stamp-build: #6b4a2f;
  --stamp-rare: #9c6b1f;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.15) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(0,0,0,0.08) 0%, transparent 50%);
  min-height:100vh;
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  padding:1.2rem 0.8rem 2.5rem;
  color: var(--ink);
}
.book { max-width:480px; margin:0 auto; }

/* 木の看板ヘッダー */
.signboard {
  background:linear-gradient(160deg, var(--wood) 0%, var(--wood-dark) 100%);
  border-radius:10px; padding:1.2rem 1.3rem 1rem; position:relative;
  box-shadow:0 6px 0 rgba(0,0,0,0.18), 0 10px 18px rgba(0,0,0,0.25);
  border:1px solid rgba(0,0,0,0.2);
}
.signboard::before {
  content:''; position:absolute; inset:6px;
  border:1.5px solid rgba(212,168,90,0.35); border-radius:5px; pointer-events:none;
}
.sb-eyebrow { font-size:0.6rem; letter-spacing:0.25em; color:rgba(255,255,255,0.45); margin-bottom:0.35rem; }
.sb-title { font-size:1.5rem; font-weight:600; color:#fbeecb; letter-spacing:0.06em;
  text-shadow:0 2px 3px rgba(0,0,0,0.4); display:flex; align-items:baseline; gap:0.5rem; }
.sb-title .farm-name { font-size:0.82rem; color:rgba(255,255,255,0.55); font-weight:500; }
.sb-sub { margin-top:0.5rem; font-size:0.7rem; color:rgba(255,255,255,0.55); line-height:1.7;
  border-top:1px dashed rgba(255,255,255,0.2); padding-top:0.5rem; }

/* とじ紐 */
.binding { height:22px; display:flex; justify-content:center; position:relative; margin-bottom:-8px; z-index:2; }
.binding::before {
  content:''; width:3px;
  background:repeating-linear-gradient(to bottom, #b89a63 0 6px, transparent 6px 11px);
}

/* ノート本体 */
.pages {
  background:var(--paper); border-radius:4px 4px 10px 10px;
  box-shadow:0 2px 0 rgba(0,0,0,0.05), 0 14px 26px rgba(0,0,0,0.18);
  padding:1.5rem 1.2rem 1.6rem; position:relative;
}
.season-block { margin-bottom:1.4rem; }
.season-block:last-child { margin-bottom:0; }
.season-head { display:flex; align-items:baseline; gap:0.6rem; margin-bottom:0.5rem; padding-bottom:0.3rem; }
.season-year { font-size:1rem; font-weight:600; color:var(--ink); }
.season-name { font-size:0.75rem; color:var(--mana); font-weight:700;
  background:var(--mana-soft); padding:0.1rem 0.55rem; border-radius:10px; }
.season-line { flex:1; height:1px; opacity:0.4;
  background:repeating-linear-gradient(to right, var(--ink-soft) 0 4px, transparent 4px 8px); }

/* エントリ */
.entry { display:flex; align-items:flex-start; gap:0.7rem; padding:0.45rem 0; }
.stamp {
  flex:none; width:34px; height:34px; border-radius:50%;
  border:2px solid currentColor; display:flex; align-items:center; justify-content:center;
  font-size:0.95rem; font-weight:600; transform:rotate(-6deg); position:relative; top:2px; opacity:0.92;
}
.entry:nth-child(even) .stamp { transform:rotate(5deg); }
.stamp.arrive, .stamp.birth, .stamp.cure { color:var(--mana); }
.stamp.ship { color:var(--stamp-ship); }
.stamp.promote, .stamp.lucky { color:var(--gold); }
.stamp.sick { color:var(--stamp-sick); }
.stamp.rare { color:var(--stamp-rare); }
.stamp.build { color:var(--stamp-build); }
.entry-body { flex:1; padding-top:0.15rem; min-width:0; }
.entry-date { font-size:0.64rem; color:var(--ink-soft); letter-spacing:0.03em; margin-bottom:0.1rem; }
.entry-text { font-size:0.88rem; line-height:1.6; color:var(--ink); }
.entry-text b { font-weight:700; border-bottom:2px solid var(--mana-soft); }

/* 7件ごとの挿絵 */
.entry-image {
  margin-top:0.5rem; padding:0.4rem;
  background:rgba(255,255,255,0.5);
  border:1px solid rgba(0,0,0,0.08); border-radius:6px;
  text-align:center;
}
.entry-image img { max-width:100%; height:auto; image-rendering:pixelated; display:block; margin:0 auto; }

.page-end { text-align:center; margin-top:1.1rem; font-size:0.66rem; color:var(--ink-soft); letter-spacing:0.1em; }
.page-end::before, .page-end::after { content:'❦'; color:var(--gold); margin:0 0.5rem; }
.empty-note { text-align:center; color:var(--ink-soft); font-size:0.85rem; line-height:2; padding:2rem 0; }

/* フッター操作行 */
.footer-bar { max-width:480px; margin:1rem auto 0; display:flex; gap:0.6rem; justify-content:center; }
.footer-btn {
  font-family:inherit; font-size:0.75rem; color:var(--wood-dark);
  background:rgba(255,255,255,0.6); border:1px solid rgba(0,0,0,0.12);
  padding:0.5rem 1rem; border-radius:20px; cursor:pointer;
}
.footer-btn:disabled { opacity:0.35; cursor:default; }
.page-indicator { font-size:0.72rem; color:var(--wood-dark); align-self:center; }
</style>
</head>
<body>

<div class="book">
  <div class="signboard">
    <div class="sb-eyebrow">Ushi Reclaim — Journal</div>
    <div class="sb-title" id="sbTitle"></div>
    <div class="sb-sub" id="sbSub"></div>
  </div>
  <div class="binding"></div>
  <div class="pages" id="pages"></div>
</div>

<div class="footer-bar">
  <button class="footer-btn" id="btnPrev"></button>
  <span class="page-indicator" id="pageIndicator"></span>
  <button class="footer-btn" id="btnNext"></button>
  <button class="footer-btn" id="btnHome"></button>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/common.js"></script>
<script>
// 牧場日誌の一覧（指示書_牧場日誌（思い出ログ）実装.md対応）
// 記録の保存はcommon.jsのaddJournalEntry()側で行う。ここは表示専用
const PAGE_SIZE = 30; // 1ページあたりの件数。件数が増えても一度に描画しすぎないための区切り

// カテゴリ→スタンプの一文字（デモの見た目を踏襲）
const STAMP_LABEL = {
  arrive: '来', birth: '誕', ship: '送', promote: '昇',
  sick: '病', cure: '癒', lucky: '福', rare: '特', build: '築',
};

let entries = [];
let pageIndex = 0; // 0が最も古いページ

function seasonKey(day) {
  const d = formatDate(day);
  return `${d.year}-${d.season}`;
}

function renderPage() {
  const pages = document.getElementById('pages');
  pages.innerHTML = '';

  if (entries.length === 0) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = t('journal_empty');
    pages.appendChild(note);
    updateFooter();
    return;
  }

  const start = pageIndex * PAGE_SIZE;
  const slice = entries.slice(start, start + PAGE_SIZE);

  let currentSeason = null;
  let block = null;
  slice.forEach(e => {
    const key = seasonKey(e.day);
    if (key !== currentSeason) {
      currentSeason = key;
      const d = formatDate(e.day);
      block = document.createElement('div');
      block.className = 'season-block';
      const head = document.createElement('div');
      head.className = 'season-head';
      head.innerHTML =
        `<span class="season-year">${d.year}${t('journal_year_suffix')}</span>` +
        `<span class="season-name">${d.season}</span>` +
        `<div class="season-line"></div>`;
      block.appendChild(head);
      pages.appendChild(block);
    }

    const d = formatDate(e.day);
    const entry = document.createElement('div');
    entry.className = 'entry';

    const stamp = document.createElement('div');
    stamp.className = 'stamp ' + e.category;
    stamp.textContent = STAMP_LABEL[e.category] || '記';
    entry.appendChild(stamp);

    const body = document.createElement('div');
    body.className = 'entry-body';

    const date = document.createElement('div');
    date.className = 'entry-date';
    date.textContent = `${d.month}${t('journal_month_suffix')}${d.half}・Day ${e.day}`;
    body.appendChild(date);

    const text = document.createElement('div');
    text.className = 'entry-text';
    // 牛の名前だけ強調する（テキストは自由記述なので、名前が含まれる時だけ置き換える）
    if (e.cowName && e.text.includes(e.cowName)) {
      const parts = e.text.split(e.cowName);
      parts.forEach((part, i) => {
        if (i > 0) {
          const b = document.createElement('b');
          b.textContent = e.cowName;
          text.appendChild(b);
        }
        text.appendChild(document.createTextNode(part));
      });
    } else {
      text.textContent = e.text;
    }
    body.appendChild(text);

    // 7件ごとの挿絵（imageKeyは記録時に決まっている）
    if (e.imageKey) {
      const wrap = document.createElement('div');
      wrap.className = 'entry-image';
      const img = document.createElement('img');
      img.src = `assets/sprites/${e.imageKey}.png`;
      img.alt = '';
      img.onerror = () => wrap.remove(); // 画像が無くても日誌は読めるようにする
      wrap.appendChild(img);
      body.appendChild(wrap);
    }

    entry.appendChild(body);
    block.appendChild(entry);
  });

  // 最新ページの末尾にだけ締めの装飾を出す
  if (start + PAGE_SIZE >= entries.length) {
    const end = document.createElement('div');
    end.className = 'page-end';
    end.textContent = t('journal_page_end');
    pages.appendChild(end);
  }

  updateFooter();
  window.scrollTo(0, 0);
}

function updateFooter() {
  const totalPages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
  document.getElementById('btnPrev').disabled = pageIndex <= 0;
  document.getElementById('btnNext').disabled = pageIndex >= totalPages - 1;
  document.getElementById('pageIndicator').textContent =
    t('journal_page_indicator').replace('{cur}', pageIndex + 1).replace('{total}', totalPages);
}

(async function () {
  await loadDict();
  document.getElementById('sbTitle').innerHTML =
    `${t('journal_title')} <span class="farm-name">${t('journal_subtitle')}</span>`;
  document.getElementById('sbSub').textContent = t('journal_lead');
  document.getElementById('btnPrev').textContent = t('journal_prev');
  document.getElementById('btnNext').textContent = t('journal_next');
  document.getElementById('btnHome').textContent = t('btn_go_home');

  entries = loadJournal();
  // 最新の出来事から読みたいので、最後のページを開いた状態で始める
  pageIndex = Math.max(0, Math.ceil(entries.length / PAGE_SIZE) - 1);

  document.getElementById('btnPrev').addEventListener('click', () => {
    if (pageIndex > 0) { pageIndex--; renderPage(); }
  });
  document.getElementById('btnNext').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
    if (pageIndex < totalPages - 1) { pageIndex++; renderPage(); }
  });
  document.getElementById('btnHome').addEventListener('click', () => { location.href = 'home.html'; });

  renderPage();
})();
</script>

</body>
</html>
