<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>やまやま牧場 - 軽トラとの会話</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a1506; min-height:100vh;
  font-family:'Hiragino Kaku Gothic ProN','MS Gothic',sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.scene-wrap {
  width:100%; max-width:440px;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  aspect-ratio: 941 / 1350;
  cursor:pointer;
  user-select:none; -webkit-user-select:none;
}
.bg-img {
  position:absolute; top:0; left:0;
  width:100%; display:block;
}

/* スプライト（プロローグの配置を流用。本ページはシーンごとの状態変化を持たない固定レイアウト） */
.sprite {
  position:absolute;
  image-rendering:pixelated;
  z-index:3;
}
.truck-sprite  { left:68%; top:56%; width:24%; }
.cow-sprite    { left:26%; top:63%; width:16%; }
.player-sprite { left:49%; top:58%; width:13%; }
.crystal-sprite { left:50%; top:30%; width:20%; transform:translateX(-50%); display:none; }

/* シーン間の一呼吸（暗転→復帰）。プロローグの暗転演出と同じ考え方 */
.fade-overlay {
  position:absolute; inset:0; background:#000;
  opacity:0; z-index:40; pointer-events:none;
  transition:opacity 0.6s;
}
.fade-overlay.show { opacity:1; }

/* 会話ボックス（プロローグと共通の演出） */
.dialogue-box {
  position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(180deg, rgba(10,8,4,0) 0%, rgba(10,8,4,0.94) 30%);
  padding:22px 24px 26px;
  min-height:110px;
  z-index:20;
}
.speaker-name {
  color:#f0e090; font-size:14px; font-weight:bold; letter-spacing:3px;
  margin-bottom:8px;
}
.dialogue-text {
  color:#e8d8c0; font-size:15px; line-height:1.9; letter-spacing:1px;
}
.dialogue-text.narration {
  font-style:italic; text-align:center; color:#a89878;
}
.tap-hint {
  text-align:right; color:#786040; font-size:11px; margin-top:10px; letter-spacing:1px;
}
</style>
</head>
<body>

<div class="scene-wrap" id="sceneWrap">
  <img class="bg-img" src="mapback.png" alt="牧場背景">

  <img class="sprite truck-sprite" src="assets/sprites/keitora.png" alt="軽トラック">
  <img class="sprite cow-sprite" id="cowSprite" src="assets/sprites/cow_mother.png" alt="牛">
  <img class="sprite player-sprite" src="assets/sprites/char_down.png" alt="主人公">
  <img class="sprite crystal-sprite" id="crystalSprite" src="assets/sprites/diary_crystal.png" alt="緑の魔石">

  <div class="fade-overlay" id="fadeOverlay"></div>

  <div class="dialogue-box">
    <div class="speaker-name" id="speakerName"></div>
    <div class="dialogue-text" id="dialogueText"></div>
    <div class="tap-hint" id="tapHint"></div>
  </div>
</div>

<script src="assets/js/i18n.js"></script>

const SCENE_OPTIONS = {
  mana_lore_tutorial: { hideCow: true, showCrystal: true },
  truck_lore_day16:   { hideCow: true, showCrystal: true },
};

// day16はbreeding_tutorial（既存10行）の直後に、一呼吸おいてtruck_lore_day16（世界観トーク）を続けて再生する
const SCENE_CHAIN = {
  breeding_tutorial: 'truck_lore_day16',
};

const QUALITY_LABEL = { 1:'劣', 2:'可', 3:'良', 4:'優' };

let sceneIndex = 0;
let scenes = [];
let currentSceneId = null;
let nextUrl = 'home.html';
let placeholders = {};
let transitioning = false;

function resolveText(key) {
  let text = t(key);
  Object.keys(placeholders).forEach(name => {
    text = text.replace('{' + name + '}', placeholders[name]);
  });
  return text;
}

function showLine(i) {
  const line = scenes[i];
  const speakerEl = document.getElementById('speakerName');
  if (line.speaker) {
    speakerEl.style.display = 'block';
    speakerEl.textContent = line.speaker;
  } else {
    speakerEl.style.display = 'none';
  }
  const textEl = document.getElementById('dialogueText');
  textEl.textContent = resolveText(line.textKey);
  textEl.classList.toggle('narration', !!line.isNarration);
}

// シーンごとの牛・魔石スプライトの出し分け
function applySceneOptions(sceneId) {
  const opts = SCENE_OPTIONS[sceneId] || {};
  document.getElementById('cowSprite').style.display = opts.hideCow ? 'none' : '';
  document.getElementById('crystalSprite').style.display = opts.showCrystal ? 'block' : 'none';
}

// 暗転を挟んで別シーンへ切り替える（day16：breeding_tutorial→truck_lore_day16の一呼吸）
function transitionToScene(sceneId) {
  transitioning = true;
  const overlay = document.getElementById('fadeOverlay');
  overlay.classList.add('show');
  setTimeout(() => {
    currentSceneId = sceneId;
    scenes = SCENE_DEF[sceneId] || [];
    sceneIndex = 0;
    applySceneOptions(sceneId);
    showLine(0);
    overlay.classList.remove('show');
    transitioning = false;
  }, 700);
}

function nextLine() {
  if (transitioning) return;
  sceneIndex++;
  if (sceneIndex >= scenes.length) {
    const chainTo = SCENE_CHAIN[currentSceneId];
    if (chainTo) {
      transitionToScene(chainTo);
      return;
    }
    location.href = nextUrl;
    return;
  }
  showLine(sceneIndex);
}

document.getElementById('sceneWrap').addEventListener('click', nextLine);

(async function () {
  await loadDict();

  const params = new URLSearchParams(location.search);
  const sceneId = params.get('scene');
  nextUrl = params.get('next') || 'home.html'; // URLSearchParamsが自動でデコードする

  currentSceneId = sceneId;
  scenes = SCENE_DEF[sceneId] || [];
  if (scenes.length === 0) {
    location.href = nextUrl;
    return;
  }
  applySceneOptions(sceneId);

  // {cowQuality}/{cowName}/{daysUntilBirth}プレースホルダー用（未使用のシーンでは無害）
  const state = loadLoopState();
  placeholders.cowQuality = QUALITY_LABEL[getQualityTier(state.cows[0].qualityPoint)] || '可';
  placeholders.cowName = state.cows[0].name;
  placeholders.daysUntilBirth = 18 - (state.cows[0].pregnantDay || 0);

  document.getElementById('tapHint').textContent = t('prologue_tap_hint');
  showLine(0);
})();
