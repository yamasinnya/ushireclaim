<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>やまやま牧場 - 牧場のできごと</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a1506; min-height:100vh;
  font-family:'Hiragino Kaku Gothic ProN','MS Gothic',sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.scene-wrap {
  width:100%; max-width:440px;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  aspect-ratio: 941 / 1350;
  cursor:pointer;
  user-select:none; -webkit-user-select:none;
}
.bg-img {
  position:absolute; top:0; left:0;
  width:100%; display:block;
}
/* ホーム画面と同じ配置物の見せ方を流用する */
.placed {
  position:absolute;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 4px rgba(0,0,0,0.35));
}
.shadow-blob {
  position:absolute;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%);
  border-radius:50%;
}
/* 人形芝居：left/topをCSSトランジションで動かすだけの簡単な演出 */
.actor, .actor-shadow {
  transition: left 1.1s ease-in-out, top 1.1s ease-in-out;
}

.dialogue-box {
  position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(180deg, rgba(10,8,4,0) 0%, rgba(10,8,4,0.94) 30%);
  padding:22px 24px 26px;
  min-height:110px;
  z-index:20;
  display:none;
}
.dialogue-box.show { display:block; }
.dialogue-text {
  color:#e8d8c0; font-size:15px; line-height:1.9; letter-spacing:1px;
}
.tap-hint {
  text-align:right; color:#786040; font-size:11px; margin-top:10px; letter-spacing:1px;
}
</style>
</head>
<body>

<div class="scene-wrap" id="sceneWrap">
  <img class="bg-img" src="mapback.png" alt="牧場">
  <div id="buildingLayer"></div>
  <div id="cowLayer"></div>

  <div class="dialogue-box" id="dialogueBox">
    <div class="dialogue-text" id="dialogueText"></div>
    <div class="tap-hint" id="tapHint"></div>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/common.js"></script>
<script>
// 良いランダムイベント（指示書_良いランダムイベント（人形芝居演出）実装.md対応）
// 発生の有無はupkeep.html側で判定済み。ここでは種類の抽選・効果の適用・演出を行う。
// 背景と配置物はホーム画面(home.html)と同じ見せ方を流用している
let nextUrl = 'home.html';
let tapEnabled = false;

const BUILDING_SPRITES = {
  gyusha_small:     { src:'assets/sprites/gyusha_small.png', style:'left:22%; top:54%; width:26%; z-index:2;', shadow:'left:23%; top:68%; width:22%; height:6.5%; z-index:1;' },
  magicWaterTrough: { src:'assets/sprites/mizunomiba.png',   style:'left:4%; top:40%; width:14%; z-index:2;',  shadow:'left:5%; top:47%; width:12%; height:2.5%; z-index:1;' },
};

function renderBuildings(state) {
  const layer = document.getElementById('buildingLayer');
  Object.keys(BUILDING_SPRITES).forEach(key => {
    if (!state.buildings[key]) return;
    const def = BUILDING_SPRITES[key];
    const shadow = document.createElement('div');
    shadow.className = 'shadow-blob';
    shadow.style.cssText = def.shadow;
    layer.appendChild(shadow);
    const img = document.createElement('img');
    img.className = 'placed';
    img.style.cssText = def.style;
    img.src = def.src;
    layer.appendChild(img);
  });
}

// 子牛は月齢別スプライト、成牛は模様生成用の共通元画像（COW_BASE_SPRITE）を使う。
// 成牛だけ共通画像なのは、牛舎と同じぶち模様を再現するため（元画像が違うと模様が変わる）
function cowSpriteForAge(ageDays) {
  const months = ageDays / 2;
  if (months < 2) return 'assets/sprites/cow_newborn.png';
  if (months < 4) return 'assets/sprites/cow_2m.png';
  if (months < 10) return 'assets/sprites/cow_4m.png';
  return 'assets/sprites/cow_10m.png';
}
function spriteFor(cow) {
  return cow.type === 'calf' ? cowSpriteForAge(cow.age) : COW_BASE_SPRITE;
}

// ── ぶち牛パターン生成（barn.jsのpreRenderCowと同じ手法。seedから同一模様を再現する） ──
// 自分の牛だと分かる方が愛着が湧くため、この演出では固有のぶち模様つきで描く（口頭指示対応）
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function isFur(r, g, b) { return (r + g + b) / 3 < 150 && Math.max(r, g, b) - Math.min(r, g, b) < 25; }
function makeBgTransparent(imageData, tolerance) {
  const px = imageData.data;
  const bg = [px[0], px[1], px[2]];
  for (let i = 0; i < px.length; i += 4) {
    if (Math.abs(px[i] - bg[0]) <= tolerance && Math.abs(px[i + 1] - bg[1]) <= tolerance && Math.abs(px[i + 2] - bg[2]) <= tolerance) {
      px[i + 3] = 0;
    }
  }
}
function growBlob(mask, w, h, si, size, rng) {
  const vis = new Set(), fr = [si], res = [];
  while (fr.length && res.length < size) {
    const p = Math.floor(rng() * fr.length), idx = fr.splice(p, 1)[0];
    if (vis.has(idx)) continue;
    if (idx < 0 || idx >= w * h || !mask[idx]) continue;
    vis.add(idx); res.push(idx);
    [idx - 1, idx + 1, idx - w, idx + w].forEach(n => { if (!vis.has(n)) fr.push(n); });
  }
  return res;
}
// 生成したぶち模様をdataURLで返す（img.srcに差し込んで使う）
function renderCowDataUrl(spriteSrc, seed) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const rng = makeRng(seed);
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const oct = oc.getContext('2d');
      oct.imageSmoothingEnabled = false;
      oct.drawImage(img, 0, 0);
      const d = oct.getImageData(0, 0, oc.width, oc.height);
      makeBgTransparent(d, 10);
      const px = d.data;
      const mask = new Uint8Array(oc.width * oc.height);
      for (let i = 0; i < mask.length; i++) mask[i] = isFur(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]) ? 1 : 0;
      const fi = []; for (let i = 0; i < mask.length; i++) if (mask[i]) fi.push(i);
      if (fi.length) {
        const col = [[235, 225, 210], [150, 100, 60]][Math.floor(rng() * 2)];
        for (let p = 0; p < 2 + Math.floor(rng() * 3); p++) {
          growBlob(mask, oc.width, oc.height, fi[Math.floor(rng() * fi.length)], 60 + Math.floor(rng() * 140), rng)
            .forEach(i => {
              const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
              const br = Math.min(Math.max((r + g + b) / 3 / 30, 0.5), 1.3);
              px[i * 4] = Math.min(255, col[0] * br); px[i * 4 + 1] = Math.min(255, col[1] * br); px[i * 4 + 2] = Math.min(255, col[2] * br);
            });
        }
      }
      oct.putImageData(d, 0, 0);
      res(oc.toDataURL());
    };
    img.onerror = () => res(spriteSrc); // 生成に失敗したら元のスプライトで妥協する
    img.src = spriteSrc;
  });
}

// 演出用の小道具（動かない配置物）を置く
function placeProp(src, left, top, width) {
  const layer = document.getElementById('cowLayer');
  const shadow = document.createElement('div');
  shadow.className = 'shadow-blob';
  shadow.style.cssText = `left:${left + 1}%; top:${top + 8}%; width:${width - 2}%; height:2%; z-index:3;`;
  layer.appendChild(shadow);

  const img = document.createElement('img');
  img.className = 'placed';
  img.style.cssText = `left:${left}%; top:${top}%; width:${width}%; z-index:4;`;
  img.src = src;
  layer.appendChild(img);
}

// 演出用の牛を1頭配置し、あとから位置を動かせるハンドルを返す
function placeActor(cow, left, top, width) {
  const layer = document.getElementById('cowLayer');
  const shadow = document.createElement('div');
  shadow.className = 'shadow-blob actor-shadow';
  shadow.style.cssText = `left:${left + 1}%; top:${top + 7}%; width:${width - 1}%; height:2%; z-index:3;`;
  layer.appendChild(shadow);

  const img = document.createElement('img');
  img.className = 'placed actor';
  img.style.cssText = `left:${left}%; top:${top}%; width:${width}%; z-index:4;`;
  const baseSrc = spriteFor(cow);
  img.src = baseSrc;
  // ぶち模様は成牛のみ。子牛は月齢別スプライトをそのまま使う（模様生成用の共通元画像が無いため）
  if (cow.type !== 'calf') {
    // 模様の生成は非同期なので、先に素のスプライトを出しておいて後から差し替える
    renderCowDataUrl(baseSrc, cow.seed).then(url => { img.src = url; });
  }
  layer.appendChild(img);

  return {
    moveTo(nextLeft) {
      img.style.left = nextLeft + '%';
      shadow.style.left = (nextLeft + 1) + '%';
    },
  };
}

function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function showText(text) {
  document.getElementById('dialogueText').textContent = text;
  document.getElementById('dialogueBox').classList.add('show');
  tapEnabled = true;
}

document.getElementById('sceneWrap').addEventListener('click', () => {
  if (!tapEnabled) return;
  location.href = nextUrl;
});

(async function () {
  await loadDict();

  const params = new URLSearchParams(location.search);
  nextUrl = params.get('next') || 'home.html';

  const state = loadLoopState();
  if (state.cows.length === 0) { location.href = nextUrl; return; }
  renderBuildings(state);

  const mothers = state.cows.filter(c => c.type === 'mother');
  const calves = state.cows.filter(c => c.type === 'calf');

  // 候補の組み立て：親子じゃれ合いは母牛・子牛が両方いる時のみ
  const candidates = ['money', 'wara'];
  if (mothers.length > 0 && calves.length > 0) candidates.push('play');
  // 動作確認用に日付で種類を固定できる。候補に無い種類が指定されていたらランダムに戻す
  const forcedKind = GOOD_EVENT_FORCE_BY_DAY[state.day];
  const kind = candidates.includes(forcedKind) ? forcedKind : pickRandom(candidates);

  let text = '';
  if (kind === 'play') {
    const mother = pickRandom(mothers);
    const calf = pickRandom(calves);
    mother.qualityPoint = (mother.qualityPoint || 0) + GOOD_EVENT_QUALITY_GAIN;
    text = t('good_event_play')
      .replace(/\{mother\}/g, mother.name)
      .replace('{calf}', calf.name);
    // 親子が近づいてじゃれ合う見せ方（ぶち模様が見えるよう大きめに描く）
    const motherActor = placeActor(mother, 14, 62, 26);
    const calfActor = placeActor(calf, 58, 68, 19);
    setTimeout(() => { motherActor.moveTo(26); calfActor.moveTo(46); }, 350);
  } else {
    const cow = pickRandom(state.cows);
    if (kind === 'money') {
      const gain = GOOD_EVENT_MONEY_MIN + Math.floor(Math.random() * (GOOD_EVENT_MONEY_MAX - GOOD_EVENT_MONEY_MIN + 1));
      state.money += gain;
      text = t('good_event_money').replace('{name}', cow.name);
    } else {
      state.wrapWara = (state.wrapWara || 0) + GOOD_EVENT_WARA_DAYS * WRAP_WARA_PT_PER_DAY;
      text = t('good_event_wara').replace('{name}', cow.name);
      // もらったラップ藁を、倉庫に積まれた状態のスプライトで牛の傍らに置く
      placeProp('assets/sprites/wrap_wara.png', 50, 60, 26);
    }
    // 1頭が数歩あるく見せ方（ぶち模様が見えるよう大きめに描く）
    const actor = placeActor(cow, 16, 64, cow.type === 'calf' ? 19 : 26);
    setTimeout(() => actor.moveTo(30), 350);
  }

  saveLoopState(state);

  document.getElementById('tapHint').textContent = t('prologue_tap_hint');
  // 動きが終わってからテキストを出す（移動1.1s + 開始待ち0.35s）
  setTimeout(() => showText(text), 1600);
})();
</script>

</body>
</html>
